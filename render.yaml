services:
  - type: web
    name: pokebonk-coop
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
